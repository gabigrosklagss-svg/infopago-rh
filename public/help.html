<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ &amp; Ajuda — InfoPago RH</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  .faq-item {
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    margin-bottom: 8px;
    background: var(--paper);
    transition: border-color var(--t-fast);
  }
  .faq-item:hover { border-color: var(--brand-500); }
  .faq-q {
    padding: 14px 18px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13.5px;
    display: flex; align-items: center; justify-content: space-between;
    user-select: none;
  }
  .faq-q::after {
    content: '+';
    font-size: 20px; color: var(--brand-500);
    transition: transform var(--t-fast);
    line-height: 1;
  }
  .faq-item.open .faq-q::after { content: '−'; }
  .faq-a {
    padding: 0 18px;
    max-height: 0; overflow: hidden;
    color: var(--ink-2); font-size: 13px; line-height: 1.6;
    transition: max-height var(--t), padding var(--t);
  }
  .faq-item.open .faq-a { padding: 0 18px 16px; max-height: 800px; }
  .faq-a p { margin: 0 0 8px; }
  .faq-a ul { margin: 4px 0 8px; padding-left: 22px; }
  .faq-a code { background: var(--paper-3); padding: 2px 6px; border-radius: 3px; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="breadcrumb">
      <a href="/dashboard.html">Painel</a>
      <span class="sep">›</span>
      <span>FAQ &amp; Ajuda</span>
    </div>

    <div class="page-header">
      <div>
        <h1>FAQ &amp; Ajuda</h1>
        <p class="subtitle">Perguntas frequentes sobre o sistema InfoPago RH</p>
      </div>
    </div>

    <div class="card">
      <input type="search" id="faq-search" placeholder="Buscar pergunta..." style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:13px;margin-bottom:16px" oninput="filtrarFAQ(this.value)">
      <div id="faq-list"></div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth();
  mountShell('help');

  const FAQ = [
    {
      q: 'Como cadastro um novo funcionário?',
      a: `<p>Vá em <strong>Funcionários → + Novo funcionário</strong>. Preencha as 4 abas (Pessoal, Trabalho, Benefícios, Bancário). Campos com <strong style="color:var(--danger)">*</strong> são obrigatórios.</p><p>Depois de salvar, clique novamente no funcionário e use o botão "Selecionar foto" para enviar a foto 3x4.</p>`
    },
    {
      q: 'Como gerar holerites em lote?',
      a: `<p>Em <strong>Holerites → + Gerar em lote</strong>. Escolha mês/ano, data de pagamento e opcionalmente um departamento.</p><p>As <strong>horas extras 50% e 100%</strong> são calculadas <strong>automaticamente</strong> a partir do controle de ponto:</p><ul><li>Sábado trabalhado → HE 50%</li><li>Domingo / feriado → HE 100%</li><li>Horas que excedem carga diária em dia útil → HE 50%</li></ul>`
    },
    {
      q: 'O que é Senha de App do Gmail?',
      a: `<p>É uma senha especial de 16 caracteres gerada no Google para apps externos (o Gmail não aceita mais sua senha normal). Para criar:</p><ul><li>Ative a Verificação em 2 etapas em <code>myaccount.google.com/security</code></li><li>Acesse <code>myaccount.google.com/apppasswords</code></li><li>Crie uma senha chamada "InfoPago RH"</li><li>Copie a senha SEM os espaços</li></ul>`
    },
    {
      q: 'Onde os PDFs dos holerites ficam salvos?',
      a: `<p>Localmente em <code>uploads/holerites/{ano}/{mês}/{matrícula}_{nome}.pdf</code>. Cada PDF tem 2 páginas: a primeira é o holerite tradicional CLT, a segunda é o espelho de ponto com dia-a-dia da competência.</p>`
    },
    {
      q: 'Como funciona o controle de ponto?',
      a: `<p>Em <strong>Jornada & Férias → Controle de ponto</strong>. Selecione um funcionário, mês e ano, e edite os dias clicando no ✎. Para cada dia, registre as 4 marcações: entrada, almoço (saída), volta, saída fim.</p><p>O sistema calcula automaticamente:</p><ul><li>Horas trabalhadas</li><li>Horas extras (acima da carga diária)</li><li>Horas faltantes (abaixo da carga diária)</li><li>Banco de horas (acumulado)</li></ul>`
    },
    {
      q: 'Como anexar documentos do funcionário?',
      a: `<p>Clique no nome do funcionário na lista → aba <strong>Documentos</strong> → <strong>+ Adicionar documento</strong>. Escolha o tipo (RG, CTPS, exame, contrato, etc.) e faça upload de PDF, JPG, PNG ou WebP até 20 MB.</p><p>Os documentos ficam armazenados no Supabase Storage (privado) e são acessíveis via URL assinada com validade de 1 hora.</p>`
    },
    {
      q: 'Como solicitar e aprovar férias?',
      a: `<p><strong>Solicitar:</strong> Em <strong>Solicitações de Férias → + Nova solicitação</strong>. Informe período pretendido, dias vendidos e se vai adiantar o 13º.</p><p><strong>Aprovar:</strong> Vá em <strong>Solicitações de Férias</strong> e clique em ✓ Aprovar ou ✕ Negar. Quando aprovado, o sistema atualiza o período aquisitivo automaticamente.</p>`
    },
    {
      q: 'Como iniciar processo de admissão (onboarding)?',
      a: `<p>No pop-up do funcionário, aba "Admissão/Demissão" → "+ Iniciar admissão". O sistema cria automaticamente um checklist com 11 itens padrão CLT (documentos, exames, contrato, EPIs, e-mail, etc.).</p><p>Cada item tem um responsável (RH, Gestor, TI, Funcionário). Marque os itens conforme conclui. Quando todos obrigatórios são concluídos, o checklist é fechado automaticamente.</p>`
    },
    {
      q: 'Como excluir um holerite?',
      a: `<p>Na lista de holerites, clique no botão de ações (3 pontos) → <strong>Excluir</strong>. Apenas usuários com permissão <code>payslips.delete</code> podem excluir. A exclusão é permanente e remove:</p><ul><li>O registro do banco</li><li>O PDF do disco</li><li>Os logs de envio associados</li></ul>`
    },
    {
      q: 'Como funciona o envio automático de holerites?',
      a: `<p>Em <strong>Envios → Agendar envio</strong>. Escolha competência, data e horário. O sistema executa o envio automaticamente nos horários 07:55 e 08:05 do dia agendado.</p><p>Cada funcionário recebe seu próprio PDF anexado + link de confirmação de recebimento.</p>`
    },
    {
      q: 'Que tabelas tributárias o sistema usa?',
      a: `<p>O sistema tem tabelas CLT 2025 e 2026 (INSS, IRRF, FGTS, salário-família, dependentes) e usa automaticamente a tabela do ano da competência do holerite.</p><p>Para atualizar quando o Governo publicar a tabela 2027, basta editar <code>src/services/payroll.js</code> e adicionar um novo bloco em <code>TABELAS_TRIBUTARIAS</code>.</p>`
    },
    {
      q: 'Como funciona o RBAC (cargos e permissões)?',
      a: `<p>O sistema tem 5 cargos: <strong>Super Admin, Admin, RH, Financeiro, Gestor</strong>. Cada cargo possui um conjunto de permissões (ex: <code>employees.update</code>, <code>salary.update</code>).</p><p>Em <strong>Admin → Usuários & Permissões</strong>, o Super Admin pode atribuir múltiplos cargos a um mesmo usuário e editar as permissões de cada cargo (exceto Super Admin).</p>`
    },
    {
      q: 'Como funciona o Banco de Currículos?',
      a: `<p>Em <strong>Gente & Talentos → Banco de Currículos</strong>, você armazena currículos enviados sem vaga específica. Pode subir PDF/DOCX que a Ingrid extrai os campos automaticamente.</p><p>Quando uma vaga compatível abrir, clique em <strong>Candidatar à vaga</strong> e o sistema cria o candidato no pipeline de Recrutamento.</p>`
    },
    {
      q: 'Como alterar entre tema claro e escuro?',
      a: `<p>Clique no botão de sol/lua no canto superior direito do header. O sistema também respeita a preferência do seu sistema operacional automaticamente.</p>`
    },
  ];

  function renderFAQ(filter = '') {
    const f = filter.toLowerCase().trim();
    const filtered = FAQ.filter(item => !f || item.q.toLowerCase().includes(f) || item.a.toLowerCase().includes(f));
    const cont = document.getElementById('faq-list');
    if (!filtered.length) { cont.innerHTML = '<p class="text-muted">Nenhuma pergunta encontrada.</p>'; return; }
    cont.innerHTML = filtered.map((item) => `
      <div class="faq-item" onclick="this.classList.toggle('open')">
        <div class="faq-q">${item.q}</div>
        <div class="faq-a">${item.a}</div>
      </div>`).join('');
  }
  function filtrarFAQ(v) { renderFAQ(v); }

  renderFAQ();
</script>
</body>
</html>
