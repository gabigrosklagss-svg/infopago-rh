<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ &amp; Ajuda — InfoPago RH</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  .faq-item {
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    margin-bottom: 8px;
    background: var(--paper);
    transition: border-color var(--t-fast);
  }
  .faq-item:hover { border-color: var(--brand-500); }
  .faq-q {
    padding: 14px 18px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13.5px;
    display: flex; align-items: center; justify-content: space-between;
    user-select: none;
  }
  .faq-q::after {
    content: '+';
    font-size: 20px; color: var(--brand-500);
    transition: transform var(--t-fast);
    line-height: 1;
  }
  .faq-item.open .faq-q::after { content: '−'; }
  .faq-a {
    padding: 0 18px;
    max-height: 0; overflow: hidden;
    color: var(--ink-2); font-size: 13px; line-height: 1.6;
    transition: max-height var(--t), padding var(--t);
  }
  .faq-item.open .faq-a { padding: 0 18px 16px; max-height: 800px; }
  .faq-a p { margin: 0 0 8px; }
  .faq-a ul { margin: 4px 0 8px; padding-left: 22px; }
  .faq-a code { background: var(--paper-3); padding: 2px 6px; border-radius: 3px; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="breadcrumb">
      <a href="/dashboard.html">Painel</a>
      <span class="sep">›</span>
      <span>FAQ &amp; Ajuda</span>
    </div>

    <div class="page-header">
      <div>
        <h1>FAQ &amp; Ajuda</h1>
        <p class="subtitle">Perguntas frequentes sobre o sistema InfoPago RH</p>
      </div>
    </div>

    <div class="card">
      <input type="search" id="faq-search" placeholder="Buscar pergunta..." style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:13px;margin-bottom:16px" oninput="filtrarFAQ(this.value)">
      <div id="faq-list"></div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth();
  mountShell('help');

  const FAQ = [
    {
      q: 'Como cadastro um novo funcionário?',
      a: `<p>Vá em <strong>Funcionários → + Novo funcionário</strong>. Preencha as 4 abas (Pessoal, Trabalho, Benefícios, Bancário). Os campos com <strong style="color:var(--danger)">*</strong> são obrigatórios.</p><p>Depois de salvar, clique novamente no funcionário e use o botão "Selecionar foto" para enviar a foto 3x4.</p>`
    },
    {
      q: 'Como gerar holerites em lote?',
      a: `<p>Em <strong>Holerites → + Gerar em lote</strong>. Escolha mês/ano, data de pagamento e opcionalmente um departamento.</p><p>As <strong>horas extras 50% e 100%</strong> são calculadas <strong>automaticamente</strong> a partir do controle de ponto:</p><ul><li>Sábado trabalhado → HE 50%</li><li>Domingo / feriado → HE 100%</li><li>Horas que excedem carga diária em dia útil → HE 50%</li></ul>`
    },
    {
      q: 'Como funciona o controle de ponto?',
      a: `<p>Em <strong>Jornada & Férias → Controle de ponto</strong>. Selecione um funcionário, mês e ano, e edite os dias. Para cada dia, registre as 4 marcações: entrada, almoço (saída), volta, saída fim.</p><p>O sistema calcula automaticamente as horas trabalhadas, horas extras, horas faltantes e o banco de horas acumulado.</p>`
    },
    {
      q: 'Como anexar documentos do funcionário?',
      a: `<p>Clique no nome do funcionário na lista → aba <strong>Documentos</strong> → <strong>+ Adicionar documento</strong>. Escolha o tipo (RG, CTPS, exame, contrato, etc.) e faça upload de PDF, JPG, PNG ou WebP até 20 MB.</p>`
    },
    {
      q: 'Como solicitar e aprovar férias?',
      a: `<p><strong>Solicitar:</strong> Em <strong>Solicitações de Férias → + Nova solicitação</strong>. Informe período pretendido, dias vendidos e se vai adiantar o 13º.</p><p><strong>Aprovar:</strong> Vá em <strong>Solicitações de Férias</strong> e clique em ✓ Aprovar ou ✕ Negar. Quando aprovado, o sistema atualiza o período aquisitivo automaticamente.</p>`
    },
    {
      q: 'O que são férias coletivas e quando uso?',
      a: `<p>Férias coletivas são períodos onde a empresa inteira (ou um setor) para juntos. Em <strong>Solicitações de Férias → aba Férias Coletivas → + Novo período</strong> você define data início/fim e escopo (toda empresa ou um departamento específico).</p><p>Ao clicar em "Aplicar", o sistema lança férias em massa pra todos os funcionários do escopo automaticamente.</p>`
    },
    {
      q: 'Como iniciar processo de admissão (onboarding)?',
      a: `<p>No pop-up do funcionário, aba <strong>Admissão/Demissão</strong> → <strong>+ Iniciar admissão</strong>. O sistema cria automaticamente um checklist com 11 itens padrão CLT (documentos, exames, contrato, EPIs, e-mail, etc.).</p><p>Cada item tem um responsável (RH, Gestor, TI, Funcionário). Marque conforme conclui. Quando todos obrigatórios são concluídos, o checklist fecha automaticamente.</p>`
    },
    {
      q: 'Como demito um funcionário (rescisão)?',
      a: `<p>Vá em <strong>Rescisão e 13º → + Nova rescisão</strong>. Escolha o funcionário, tipo de rescisão (pedido, sem justa causa, com justa causa, etc.), datas e o sistema calcula automaticamente saldo de salário, férias proporcionais, 13º proporcional, aviso prévio e FGTS.</p><p>Ao salvar, o funcionário sai da lista de ativos e fica armazenado na seção de rescisão com todas as informações preservadas.</p>`
    },
    {
      q: 'Como funciona o envio automático de holerites?',
      a: `<p>Em <strong>Envios → Agendar envio</strong>. Escolha competência, data e horário. O sistema executa o envio automaticamente nos horários 07:55 e 08:05 do dia agendado.</p><p>Cada funcionário recebe seu próprio PDF anexado + link de confirmação de recebimento.</p>`
    },
    {
      q: 'Como crio um comunicado para os funcionários?',
      a: `<p>Em <strong>Calendário & Comunicados → aba Comunicados → + Novo comunicado</strong>. Escreva título e conteúdo, anexe imagem ou arquivo se quiser, escolha o escopo (toda empresa, departamentos específicos ou funcionários específicos) e marque "Enviar por e-mail ao salvar".</p><p>O sistema dispara automaticamente o e-mail pra cada funcionário do escopo.</p>`
    },
    {
      q: 'Como crio um evento (festa, reunião, treinamento)?',
      a: `<p>Em <strong>Calendário & Comunicados → aba Calendário</strong>, clique em qualquer dia do mês ou no botão "+ Novo evento". Preencha título, data, horário (opcional), local, categoria e cor.</p><p>O evento aparece tanto no grid do calendário quanto na lista de eventos do mês abaixo. Notificações são enviadas automaticamente para o sino do header quando o evento estiver nos próximos 7 dias.</p>`
    },
    {
      q: 'Como funciona o Banco de Currículos?',
      a: `<p>Em <strong>Gente & Talentos → Banco de Currículos</strong>, você armazena currículos enviados sem vaga específica. Pode subir PDF/DOCX que a IA extrai os campos automaticamente.</p><p>Quando uma vaga compatível abrir, clique em <strong>Candidatar à vaga</strong> e o sistema cria o candidato no pipeline de Recrutamento.</p>`
    },
    {
      q: 'O que é o Custo Total de Contratação (CTC)?',
      a: `<p>É uma calculadora que estima quanto vai custar de verdade contratar alguém — não apenas o salário, mas todos os encargos da CLT (INSS patronal, FGTS, Sistema S, RAT), provisões (13º, férias + 1/3) e benefícios (VT, VR, plano de saúde, etc.).</p><p>Acesse em <strong>Gente & Talentos → Custo de Contratação</strong>. Útil pra orçar uma vaga antes de abrir.</p>`
    },
    {
      q: 'Como funciona a avaliação de desempenho?',
      a: `<p>Em <strong>Gente & Talentos → Avaliação de desempenho → + Novo ciclo</strong>. Defina nome, período e critérios (ex: Produtividade, Pontualidade, Trabalho em equipe).</p><p>Depois clique em "Adicionar funcionários" pra incluir todos ou só de um departamento. Cada avaliação ganha notas 0–5 por critério, pontos fortes/melhoria e plano de ação.</p>`
    },
    {
      q: 'Como faço para alterar entre tema claro e escuro?',
      a: `<p>Clique no botão de sol/lua no canto superior direito do header. O sistema também respeita a preferência do seu sistema operacional automaticamente.</p>`
    },
    {
      q: 'Onde encontro os relatórios analíticos?',
      a: `<p>Em <strong>Análise → Relatórios analíticos</strong>. São 10 dimensões: Headcount, Turnover, Custo de Pessoal, Absenteísmo, Horas Extras, Férias (alertas), Datas-chave, Distribuição salarial, Avaliação e Recrutamento.</p><p>Todos com filtros de período e departamento, gráficos interativos e exportação para CSV.</p>`
    },
    {
      q: 'Como troco minha senha?',
      a: `<p>Clique no seu nome/foto na sidebar (canto inferior esquerdo) para abrir o perfil. A troca de senha é feita pelo painel de Usuários (acessível ao Super Admin) ou via reset de senha.</p>`
    },
  ];

  function renderFAQ(filter = '') {
    const f = filter.toLowerCase().trim();
    const filtered = FAQ.filter(item => !f || item.q.toLowerCase().includes(f) || item.a.toLowerCase().includes(f));
    const cont = document.getElementById('faq-list');
    if (!filtered.length) { cont.innerHTML = '<p class="text-muted">Nenhuma pergunta encontrada.</p>'; return; }
    cont.innerHTML = filtered.map((item) => `
      <div class="faq-item" onclick="this.classList.toggle('open')">
        <div class="faq-q">${item.q}</div>
        <div class="faq-a">${item.a}</div>
      </div>`).join('');
  }
  function filtrarFAQ(v) { renderFAQ(v); }

  renderFAQ();
</script>
</body>
</html>
