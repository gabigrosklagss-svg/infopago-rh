<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Configurações — InfoPago RH</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="page-header">
      <div><h1>Configurações</h1><p class="subtitle">Empresa, e-mail SMTP, departamentos e cargos</p></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="goTab(0, this)"> Empresa</button>
      <button class="tab-btn" onclick="goTab(1, this)"> E-mail (SMTP)</button>
      <button class="tab-btn" onclick="goTab(2, this)"> Departamentos</button>
      <button class="tab-btn" onclick="goTab(3, this)"> Cargos</button>
    </div>

    <!-- ── Empresa ────────────────────────────────────── -->
    <div class="tab-content active card">
      <form id="empForm">
        <div class="form-grid">
          <div class="field"><label>Razão social<span class="req">*</span></label><input name="razao_social" required></div>
          <div class="field"><label>Nome fantasia</label><input name="nome_fantasia"></div>
          <div class="field"><label>CNPJ</label><input name="cnpj" data-mask="cnpj"></div>
          <div class="field"><label>Inscrição estadual</label><input name="inscricao_estadual"></div>
          <div class="field"><label>Telefone</label><input name="telefone" data-mask="telefone"></div>
          <div class="field"><label>E-mail</label><input type="email" name="email_empresa"></div>
          <div class="field"><label>CEP</label><input name="cep" data-mask="cep" onblur="onCEP(this.value)"></div>
          <div class="field" style="grid-column:span 2"><label>Endereço</label><input name="endereco"></div>
          <div class="field"><label>Cidade</label><input name="cidade"></div>
          <div class="field"><label>UF</label><input name="uf" maxlength="2"></div>
          <div class="field"><label>Dia padrão de pagamento</label><input type="number" name="dia_pagamento" min="1" max="31" value="5"></div>
        </div>
        <div class="text-right mt-4">
          <button type="button" class="btn btn-primary" onclick="salvarEmpresa()"> Salvar</button>
        </div>
      </form>
    </div>

    <!-- ── SMTP ─────────────────────────────────────────── -->
    <div class="tab-content card">
      <form id="smtpForm">
        <p class="text-muted">Use uma <strong>Senha de App</strong> do Gmail (16 caracteres, sem espaços).</p>
        <div class="form-grid">
          <div class="field"><label>Servidor SMTP<span class="req">*</span></label><input name="smtp_host" value="smtp.gmail.com" required></div>
          <div class="field"><label>Porta<span class="req">*</span></label><input type="number" name="smtp_port" value="587" required></div>
          <div class="field"><label>Usuário (e-mail)<span class="req">*</span></label><input name="smtp_user" type="email" required></div>
          <div class="field"><label>Senha de App<span class="req">*</span></label><input name="smtp_pass" type="password" required></div>
          <div class="field"><label>Nome remetente</label><input name="email_nome_remetente" value="RH"></div>
        </div>
        <div class="flex gap-2 mt-4 justify-between">
          <button type="button" class="btn" onclick="testarSMTP()"> Testar conexão</button>
          <button type="button" class="btn btn-primary" onclick="salvarSMTP()"> Salvar</button>
        </div>
      </form>
    </div>

    <!-- ── Departamentos ────────────────────────────────── -->
    <div class="tab-content card">
      <div class="flex justify-between items-center mb-4">
        <h3 style="margin:0">Departamentos da empresa</h3>
        <button class="btn btn-primary" onclick="abrirFormDept()">+ Novo departamento</button>
      </div>
      <table class="table">
        <thead><tr><th>Código</th><th>Nome</th><th>Responsável</th><th>Status</th><th></th></tr></thead>
        <tbody id="tbody-dept"></tbody>
      </table>
    </div>

    <!-- ── Cargos ───────────────────────────────────────── -->
    <div class="tab-content card">
      <div class="flex justify-between items-center mb-4">
        <h3 style="margin:0">Cargos / Funções</h3>
        <button class="btn btn-primary" onclick="abrirFormPos()">+ Novo cargo</button>
      </div>
      <table class="table">
        <thead><tr><th>Título</th><th>CBO</th><th>Nível</th><th>Departamento</th><th>Faixa salarial</th><th>Status</th><th></th></tr></thead>
        <tbody id="tbody-pos"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth();
  mountShell('settings');

  function goTab(idx, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content')[idx].classList.add('active');
    if (idx === 2) loadDepts();
    if (idx === 3) loadPositions();
  }

  /* ── Empresa ─────────────────────────────────────── */
  async function loadEmpresa() {
    try {
      const d = await api('/settings');
      fillForm(document.getElementById('empForm'), d);
      fillForm(document.getElementById('smtpForm'), d);
    } catch (err) { toast(err.message, 'error'); }
  }

  async function salvarEmpresa() {
    const f = document.getElementById('empForm');
    if (!validateForm(f)) return;
    try {
      await api('/settings', { method: 'PUT', body: formToObject(f) });
      toast('Dados da empresa salvos!', 'success');
    } catch (err) { toast(err.message, 'error'); }
  }

  async function salvarSMTP() {
    const f = document.getElementById('smtpForm');
    if (!validateForm(f)) return;
    try {
      await api('/settings', { method: 'PUT', body: formToObject(f) });
      toast('Configurações SMTP salvas!', 'success');
    } catch (err) { toast(err.message, 'error'); }
  }

  async function testarSMTP() {
    const f = document.getElementById('smtpForm');
    if (!validateForm(f)) return;
    showLoading();
    try {
      const r = await api('/settings/test-smtp', { method: 'POST', body: formToObject(f) });
      toast(r.message || 'Conexão OK!', 'success');
    } catch (err) { toast(err.message, 'error'); }
    finally { hideLoading(); }
  }

  async function onCEP(cep) {
    const d = await buscarCEP(cep);
    if (!d) return;
    const f = document.getElementById('empForm');
    f.endereco.value = [d.logradouro, d.bairro].filter(Boolean).join(', ');
    f.cidade.value = d.localidade || '';
    f.uf.value = d.uf || '';
  }

  /* ── Departamentos ───────────────────────────────── */
  async function loadDepts() {
    const ds = await api('/departments');
    document.getElementById('tbody-dept').innerHTML = ds.length
      ? ds.map(d => `
          <tr ${!d.active ? 'style="opacity:.55"' : ''}>
            <td>${d.codigo || '—'}</td>
            <td><strong>${d.nome}</strong></td>
            <td>${d.responsavel || '—'}</td>
            <td><span class="badge ${d.active ? 'ativo' : 'demitido'}">${d.active ? 'Ativo' : 'Inativo'}</span></td>
            <td>
              <button class="btn btn-sm" onclick='abrirFormDept(${JSON.stringify(d)})'>Editar</button>
              ${d.active
                ? `<button class="btn btn-sm btn-danger" onclick="toggleAtivoDept('${d.id}', false)">Desativar</button>`
                : `<button class="btn btn-sm btn-success" onclick="toggleAtivoDept('${d.id}', true)">Ativar</button>
                   <button class="btn btn-sm btn-danger" onclick="excluirDeptDef('${d.id}', '${(d.nome || '').replace(/'/g, "\\'")}')">Excluir</button>`}
            </td>
          </tr>`).join('')
      : '<tr><td colspan="5" class="table-empty">Nenhum departamento. Clique em + Novo departamento.</td></tr>';
  }

  async function toggleAtivoDept(id, novoEstado) {
    try {
      await api(`/departments/${id}`, { method: 'PUT', body: { active: novoEstado } });
      toast(novoEstado ? 'Departamento ativado.' : 'Departamento desativado.', 'success');
      loadDepts();
    } catch (err) { toast(err.message, 'error'); }
  }

  async function excluirDeptDef(id, nome) {
    if (!confirm(`Excluir DEFINITIVAMENTE o departamento "${nome}"?\n\nIsso não pode ser desfeito. Use só pra departamentos sem funcionários vinculados.`)) return;
    try {
      await api(`/departments/${id}/hard`, { method: 'DELETE' });
      toast('Excluído.', 'success');
      loadDepts();
    } catch (err) { toast(err.message, 'error'); }
  }

  function abrirFormDept(d = null) {
    const html = `<form id="deptForm">
      <div class="form-grid">
        <div class="field"><label>Nome<span class="req">*</span></label><input name="nome" required value="${d?.nome || ''}"></div>
        <div class="field"><label>Código</label><input name="codigo" value="${d?.codigo || ''}"></div>
      </div>
      <div class="field mt-4"><label>Responsável</label><input name="responsavel" value="${d?.responsavel || ''}"></div>
    </form>`;
    showFormModal(d ? 'Editar departamento' : 'Novo departamento', html, async () => {
      const f = document.getElementById('deptForm');
      if (!validateForm(f)) return;
      const data = formToObject(f);
      try {
        if (d?.id) await api(`/departments/${d.id}`, { method: 'PUT', body: data });
        else await api('/departments', { method: 'POST', body: data });
        toast('Salvo!', 'success');
        closeFormModal();
        loadDepts();
      } catch (err) { toast(err.message, 'error'); }
    });
  }

  async function desativarDept(id) {
    if (!confirm('Desativar este departamento?')) return;
    try {
      await api(`/departments/${id}`, { method: 'DELETE' });
      toast('Desativado.', 'success');
      loadDepts();
    } catch (err) { toast(err.message, 'error'); }
  }

  /* ── Cargos ──────────────────────────────────────── */
  async function loadPositions() {
    const [ps, ds] = await Promise.all([api('/positions'), api('/departments?active=true')]);
    window._depts = ds;
    document.getElementById('tbody-pos').innerHTML = ps.length
      ? ps.map(p => `
          <tr ${!p.active ? 'style="opacity:.55"' : ''}>
            <td><strong>${p.titulo}</strong></td>
            <td>${p.cbo || '—'}</td>
            <td>${p.nivel || '—'}</td>
            <td>${p.departments?.nome || '—'}</td>
            <td>${p.salario_minimo ? fmt.brl(p.salario_minimo) + ' a ' + fmt.brl(p.salario_maximo) : '—'}</td>
            <td><span class="badge ${p.active ? 'ativo' : 'demitido'}">${p.active ? 'Ativo' : 'Inativo'}</span></td>
            <td>
              <button class="btn btn-sm" onclick='abrirFormPos(${JSON.stringify(p)})'>Editar</button>
              ${p.active
                ? `<button class="btn btn-sm btn-danger" onclick="toggleAtivoPos('${p.id}', false)">Desativar</button>`
                : `<button class="btn btn-sm btn-success" onclick="toggleAtivoPos('${p.id}', true)">Ativar</button>
                   <button class="btn btn-sm btn-danger" onclick="excluirPosDef('${p.id}', '${(p.titulo || '').replace(/'/g, "\\'")}')">Excluir</button>`}
            </td>
          </tr>`).join('')
      : '<tr><td colspan="7" class="table-empty">Nenhum cargo. Clique em + Novo cargo.</td></tr>';
  }

  async function toggleAtivoPos(id, novoEstado) {
    try {
      await api(`/positions/${id}`, { method: 'PUT', body: { active: novoEstado } });
      toast(novoEstado ? 'Cargo ativado.' : 'Cargo desativado.', 'success');
      loadPositions();
    } catch (err) { toast(err.message, 'error'); }
  }

  async function excluirPosDef(id, nome) {
    if (!confirm(`Excluir DEFINITIVAMENTE o cargo "${nome}"?\n\nIsso não pode ser desfeito.`)) return;
    try {
      await api(`/positions/${id}/hard`, { method: 'DELETE' });
      toast('Excluído.', 'success');
      loadPositions();
    } catch (err) { toast(err.message, 'error'); }
  }

  function abrirFormPos(p = null) {
    const opts = (window._depts || []).map(d => `<option value="${d.id}" ${d.id === p?.department_id ? 'selected' : ''}>${d.nome}</option>`).join('');
    const niveis = ['junior','pleno','senior','especialista','coordenador','gerente','diretor'];
    const html = `<form id="posForm">
      <div class="form-grid">
        <div class="field"><label>Título<span class="req">*</span></label><input name="titulo" required value="${p?.titulo || ''}"></div>
        <div class="field"><label>CBO</label><input name="cbo" value="${p?.cbo || ''}"></div>
        <div class="field"><label>Descrição CBO</label><input name="cbo_descricao" value="${p?.cbo_descricao || ''}"></div>
        <div class="field"><label>Nível</label><select name="nivel"><option value="">—</option>${niveis.map(n => `<option value="${n}" ${n === p?.nivel ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="field"><label>Departamento</label><select name="department_id"><option value="">—</option>${opts}</select></div>
        <div class="field"><label>Sal. mínimo</label><input type="number" step="0.01" name="salario_minimo" value="${p?.salario_minimo || ''}"></div>
        <div class="field"><label>Sal. máximo</label><input type="number" step="0.01" name="salario_maximo" value="${p?.salario_maximo || ''}"></div>
      </div>
    </form>`;
    showFormModal(p ? 'Editar cargo' : 'Novo cargo', html, async () => {
      const f = document.getElementById('posForm');
      if (!validateForm(f)) return;
      const data = formToObject(f);
      try {
        if (p?.id) await api(`/positions/${p.id}`, { method: 'PUT', body: data });
        else await api('/positions', { method: 'POST', body: data });
        toast('Salvo!', 'success');
        closeFormModal();
        loadPositions();
      } catch (err) { toast(err.message, 'error'); }
    });
  }

  async function desativarPos(id) {
    if (!confirm('Desativar este cargo?')) return;
    try { await api(`/positions/${id}`, { method: 'DELETE' }); toast('Desativado.', 'success'); loadPositions(); }
    catch (err) { toast(err.message, 'error'); }
  }

  function showFormModal(title, html, onSave) {
    let m = document.getElementById('form-modal');
    if (!m) { m = document.createElement('div'); m.id = 'form-modal'; m.className = 'modal-overlay'; m.onclick = (e) => { if (e.target === m) closeFormModal(); }; document.body.appendChild(m); }
    m.innerHTML = `<div class="modal"><div class="modal-header"><h2>${title}</h2><button class="modal-close" onclick="closeFormModal()">×</button></div><div class="modal-body">${html}</div><div class="modal-footer"><button class="btn" onclick="closeFormModal()">Cancelar</button><button class="btn btn-primary" id="form-save">Salvar</button></div></div>`;
    m.classList.remove('hidden');
    initMasks(m);
    document.getElementById('form-save').onclick = onSave;
  }
  function closeFormModal() { document.getElementById('form-modal')?.remove(); }

  loadEmpresa();
</script>
</body>
</html>
