<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assinatura Digital — InfoPago RH</title>
<style>
  :root {
    --brand: #1FAB54;
    --brand-dark: #0F2E1E;
    --paper: #fff;
    --bg: #F7F9FB;
    --ink: #1F2D3D;
    --ink-3: #697386;
    --border: #E3E8EE;
    --danger: #B91C1C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); padding: 24px 16px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  .header {
    background: linear-gradient(135deg, var(--brand-dark), var(--brand));
    color: #fff; padding: 24px 28px;
    border-radius: 12px 12px 0 0;
  }
  .header h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .header p { margin: 6px 0 0; opacity: .85; font-size: 13px; }

  .card {
    background: var(--paper); border-radius: 0 0 12px 12px;
    padding: 28px; box-shadow: 0 4px 16px rgba(0,0,0,.06);
  }
  .info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    background: #f5f7fb; padding: 16px 18px; border-radius: 8px; margin-bottom: 20px;
  }
  .info-grid .row { font-size: 13px; }
  .info-grid .row strong { display: block; color: var(--ink-3); font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }

  .doc-preview {
    background: #f5f7fb; padding: 16px 18px; border-radius: 8px;
    border-left: 3px solid var(--brand); margin-bottom: 24px;
    font-size: 14px; line-height: 1.6; white-space: pre-wrap;
  }
  .doc-preview strong { color: var(--brand-dark); }

  h3 { font-size: 15px; margin: 0 0 10px; }
  .sig-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    background: #fff;
    position: relative;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 220px;
    border-radius: 6px;
    cursor: crosshair;
    background: #fff;
  }
  .sig-hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #c5cdd6; font-size: 14px; pointer-events: none;
  }
  .sig-hint.hidden { display: none; }

  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn {
    padding: 12px 20px; font-size: 14px; font-weight: 600;
    border-radius: 8px; border: 1px solid var(--border);
    background: #fff; color: var(--ink); cursor: pointer;
    transition: all .15s ease;
    min-height: 44px;
  }
  .btn:hover { background: #f5f7fb; }
  .btn-primary {
    background: linear-gradient(180deg, var(--brand), #189048);
    color: #fff; border-color: transparent;
    box-shadow: 0 2px 6px rgba(31,171,84,.25);
  }
  .btn-primary:hover { background: #189048; color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; border-color: transparent; }
  .btn-link { background: transparent; border: 0; color: var(--ink-3); }

  .alert {
    padding: 16px 20px; border-radius: 8px; margin-bottom: 20px;
    font-size: 13.5px; line-height: 1.5;
  }
  .alert.success { background: #ECFDF5; color: #15803d; border-left: 3px solid #15803d; }
  .alert.danger  { background: #FEF3F2; color: #b91c1c; border-left: 3px solid #b91c1c; }
  .alert.warn    { background: #FFFBEB; color: #a16207; border-left: 3px solid #a16207; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--ink-3); margin-bottom: 4px; }
  .field input {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px; font-family: inherit; min-height: 44px;
  }
  .field input:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(31,171,84,.15);
  }

  .footer-note {
    margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--ink-3); line-height: 1.5;
  }
  .footer-note strong { color: var(--ink); }

  @media (max-width: 600px) {
    body { padding: 12px 10px; }
    .info-grid { grid-template-columns: 1fr; }
    .card { padding: 20px 18px; }
    .header { padding: 20px 18px; }
    .actions .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Assinatura Digital</h1>
    <p>Documento para conferência e assinatura eletrônica</p>
  </div>

  <div class="card" id="card-area">
    <div id="loading" style="text-align:center;padding:40px;color:var(--ink-3)">Carregando...</div>
  </div>

  <p class="footer-note" style="text-align:center;color:#697386">
    InfoPago RH · Sistema de assinatura eletrônica com trilha de auditoria.<br>
    Todos os acessos e ações são registrados com data, hora, IP e dispositivo.
  </p>
</div>

<script>
  const token = new URLSearchParams(location.search).get('token');
  if (!token) document.getElementById('loading').textContent = 'Link inválido. Solicite um novo.';

  let sig = null;

  async function carregar() {
    try {
      const r = await fetch('/api/signatures/public/' + token);
      if (!r.ok) {
        const err = await r.json();
        document.getElementById('card-area').innerHTML = `<div class="alert danger">${err.error || 'Erro ao carregar.'}</div>`;
        return;
      }
      sig = await r.json();
      render();
    } catch (e) {
      document.getElementById('card-area').innerHTML = `<div class="alert danger">Erro de conexão: ${e.message}</div>`;
    }
  }

  function render() {
    const area = document.getElementById('card-area');

    if (sig.status === 'assinada') {
      area.innerHTML = `
        <div class="alert success">
          <strong>✓ Documento já assinado</strong><br>
          Você assinou este documento em ${new Date(sig.signed_at).toLocaleString('pt-BR')}.
        </div>
        ${docInfoHtml()}
        ${docPreviewHtml()}
      `;
      return;
    }
    if (sig.status === 'expirada' || sig.status === 'cancelada' || sig.status === 'recusada') {
      area.innerHTML = `
        <div class="alert danger">
          <strong>Solicitação ${sig.status}</strong><br>
          ${sig.status === 'expirada' ? 'Este link expirou. Solicite uma nova assinatura ao RH.' : ''}
          ${sig.status === 'cancelada' ? 'O RH cancelou esta solicitação.' : ''}
          ${sig.status === 'recusada' ? 'Você recusou esta assinatura.' : ''}
        </div>
        ${docInfoHtml()}
      `;
      return;
    }

    // Status: pendente
    area.innerHTML = `
      ${docInfoHtml()}
      ${docPreviewHtml()}

      <h3 style="margin-top:24px">Confirme seu nome</h3>
      <div class="field">
        <input id="confirm-name" value="${sig.signer_name}" placeholder="Seu nome completo">
        <small style="font-size:11.5px;color:var(--ink-3)">Ao assinar, você concorda com os termos do documento acima e atesta que leu integralmente seu conteúdo.</small>
      </div>

      <h3 style="margin-top:18px">Assine no campo abaixo</h3>
      <div class="sig-area" id="sig-area">
        <canvas id="sig-canvas"></canvas>
        <div class="sig-hint" id="sig-hint">Assine aqui (mouse ou dedo)</div>
      </div>

      <div class="actions">
        <button class="btn" onclick="limparAssinatura()">Limpar</button>
        <button class="btn btn-danger" onclick="recusar()">Recusar</button>
        <button class="btn btn-primary" onclick="assinar()" id="btn-assinar" style="flex:1">✓ Confirmar e assinar</button>
      </div>

      <p class="footer-note">
        <strong>Validade jurídica:</strong> sua assinatura eletrônica neste documento tem validade conforme
        Lei 14.063/2020 (assinatura eletrônica avançada) e Medida Provisória 2.200-2/2001. Ao confirmar,
        registramos seu IP, dispositivo, data/hora e a imagem da assinatura como prova de aceite.
      </p>
    `;
    setTimeout(initCanvas, 50);
  }

  function docInfoHtml() {
    return `
      <h2 style="margin:0 0 14px;font-size:18px">${sig.doc_titulo}</h2>
      <div class="info-grid">
        <div class="row"><strong>Tipo</strong>${sig.doc_type}</div>
        <div class="row"><strong>Signatário</strong>${sig.signer_name}</div>
        ${sig.signer_email ? `<div class="row"><strong>E-mail</strong>${sig.signer_email}</div>` : ''}
        ${sig.signer_cpf ? `<div class="row"><strong>CPF</strong>${sig.signer_cpf}</div>` : ''}
        <div class="row"><strong>Status</strong>${sig.status}</div>
        <div class="row"><strong>Válido até</strong>${new Date(sig.expires_at).toLocaleDateString('pt-BR')}</div>
      </div>
    `;
  }
  function docPreviewHtml() {
    if (!sig.doc_descricao && !sig.doc_pdf_path) return '';
    return `<div class="doc-preview">${(sig.doc_descricao || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}
      ${sig.doc_pdf_path ? `<br><br><strong>📎 Documento anexado:</strong> <a href="${sig.doc_pdf_path}" target="_blank">Baixar PDF</a>` : ''}
    </div>`;
  }

  /* Canvas drawing */
  let canvas, ctx, drawing = false, hasInk = false, lastX, lastY;
  function initCanvas() {
    canvas = document.getElementById('sig-canvas');
    if (!canvas) return;
    // Match canvas resolution to its display size (devicePixelRatio)
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = '#0A2540';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const start = e => {
      drawing = true;
      hasInk = true;
      document.getElementById('sig-hint').classList.add('hidden');
      const p = pos(e);
      lastX = p.x; lastY = p.y;
    };
    const move = e => {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
    };
    const end = () => { drawing = false; };
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointerleave', end);
    canvas.addEventListener('touchstart', e => e.preventDefault());
    canvas.addEventListener('touchmove', e => e.preventDefault());
  }
  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left), y: (e.clientY - rect.top) };
  }
  function limparAssinatura() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasInk = false;
    document.getElementById('sig-hint').classList.remove('hidden');
  }

  async function assinar() {
    if (!hasInk) { alert('Por favor, assine no campo acima.'); return; }
    const name = document.getElementById('confirm-name').value.trim();
    if (!name) { alert('Confirme seu nome.'); return; }
    const data = canvas.toDataURL('image/png');
    const btn = document.getElementById('btn-assinar');
    btn.disabled = true; btn.textContent = 'Enviando...';
    try {
      const r = await fetch('/api/signatures/public/' + token + '/sign', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ signature_data: data, signer_name: name }),
      });
      if (!r.ok) {
        const err = await r.json();
        alert(err.error || 'Erro ao assinar');
        btn.disabled = false; btn.textContent = '✓ Confirmar e assinar';
        return;
      }
      sig.status = 'assinada';
      sig.signed_at = new Date().toISOString();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      alert('Erro de conexão: ' + e.message);
      btn.disabled = false; btn.textContent = '✓ Confirmar e assinar';
    }
  }

  async function recusar() {
    const motivo = prompt('Por que está recusando? (motivo será registrado)');
    if (!motivo) return;
    try {
      await fetch('/api/signatures/public/' + token + '/refuse', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ motivo }),
      });
      sig.status = 'recusada';
      render();
    } catch (e) { alert(e.message); }
  }

  carregar();
</script>
</body>
</html>
