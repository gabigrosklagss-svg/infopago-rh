<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso — InfoPago RH</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='25%25'%3E%3Cstop offset='0%25' stop-color='%236FECA0'/%3E%3Cstop offset='40%25' stop-color='%231FAB54'/%3E%3Cstop offset='100%25' stop-color='%2307271A'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3Ctext x='50%25' y='66%25' text-anchor='middle' font-family='Inter,sans-serif' font-weight='800' font-style='italic' font-size='18' fill='%23ffffff'%3EiP%3C/text%3E%3C/svg%3E">
<style>
  .login-page { min-height: 100vh; display: grid; place-items: center; background: var(--paper-2); padding: 24px; }
  .login-card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--r); padding: 40px 36px; max-width: 380px; width: 100%; box-shadow: var(--sh-3); }
  .login-brand-mini { display: flex; align-items: center; gap: 11px; margin-bottom: 26px; }
  .login-brand-mini .mark { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 30% 25%, var(--brand-200) 0%, var(--brand-500) 50%, var(--brand-800) 100%); display: grid; place-items: center; box-shadow: inset 0 1px 2px rgba(255,255,255,.25), 0 0 12px rgba(57, 225, 117, .18); position: relative; }
  .login-brand-mini .mark::before { content: 'iP'; font-family: 'Inter', sans-serif; font-weight: 800; font-style: italic; font-size: 17px; color: #fff; letter-spacing: -.06em; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .login-brand-mini .text { line-height: 1.15; }
  .login-brand-mini .name { display: block; font-weight: 800; font-size: 16px; color: var(--ink); letter-spacing: -.01em; }
  .login-brand-mini .name em { font-style: normal; color: var(--brand-600); }
  .login-brand-mini .tag { display: block; font-size: 9.5px; font-weight: 700; color: var(--brand-600); text-transform: uppercase; letter-spacing: .18em; margin-top: 2px; }
  .login-card h1 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 24px; letter-spacing: -.02em; margin: 0 0 6px; line-height: 1.15; }
  .login-card .subtitle { color: var(--ink-3); margin: 0 0 24px; font-size: 13px; }
  .login-card .field + .field { margin-top: 12px; }
  .login-card .btn-primary { width: 100%; justify-content: center; margin-top: 20px; padding: 11px 14px; font-size: 13.5px; }
  .login-card .foot { margin-top: 24px; text-align: center; font-size: 11px; color: var(--ink-4); font-family: 'JetBrains Mono', monospace; letter-spacing: .08em; }
</style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand-mini">
      <div class="mark"></div>
      <div class="text">
        <span class="name">Info<em>Pago</em></span>
        <span class="tag">RH · Folha</span>
      </div>
    </div>
    <h1>Acesso ao sistema</h1>
    <p class="subtitle">Entre com suas credenciais corporativas.</p>
    <form id="loginForm" onsubmit="entrar(event)">
      <div class="field">
        <label>E-mail<span class="req">*</span></label>
        <input type="email" name="email" required placeholder="usuario@empresa.com.br" autofocus autocomplete="email">
      </div>
      <div class="field">
        <label>Senha<span class="req">*</span></label>
        <input type="password" name="password" required placeholder="seu acesso" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">
        Entrar
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>
    <div class="foot">v 1.1.0</div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  if (getToken()) location.href = '/dashboard.html';
  async function entrar(e) {
    e.preventDefault();
    if (!validateForm('#loginForm')) return;
    const f = e.target;
    showLoading();
    try {
      const r = await api('/auth/login', { method: 'POST', body: { email: f.email.value, password: f.password.value } });
      setToken(r.token);
      if (r.refresh_token) setRefreshToken(r.refresh_token);
      setUser(r.user);
      toast('Sessão iniciada com sucesso.', 'success', 'Bem-vindo');
      setTimeout(() => location.href = '/dashboard.html', 400);
    } catch (err) {
      toast(err.message, 'error', 'Falha na autenticação');
    } finally { hideLoading(); }
  }
</script>
</body>
</html>
