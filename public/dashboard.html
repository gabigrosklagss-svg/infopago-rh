<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — InfoPago RH</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="page-header">
      <div>
        <h1>Painel Executivo</h1>
        <p class="subtitle" id="competencia">Carregando…</p>
      </div>
      <div class="flex gap-2">
        <a href="/analytics.html" class="btn">Relatórios completos</a>
        <a href="/payslips.html" class="btn btn-primary">Gerar holerites do mês</a>
      </div>
    </div>

    <!-- Insights inteligentes (alertas automáticos) -->
    <div id="insights" class="mb-3"></div>

    <div class="kpi-grid" id="kpis">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3 class="card-title">Folha — últimos 6 meses <small>evolução mensal</small></h3>
        <canvas id="chart" height="240"></canvas>
      </div>
      <div class="card">
        <h3 class="card-title">Encargos do mês <small>INSS · IRRF · FGTS</small></h3>
        <div id="encargos"></div>
      </div>
    </div>

    <div class="grid-2 mt-5">
      <div class="card">
        <h3 class="card-title">Aniversariantes do mês <small>celebre o time</small></h3>
        <div id="aniversariantes"></div>
      </div>
      <div class="card">
        <h3 class="card-title">Férias a vencer <small>evite multa em dobro</small></h3>
        <div id="ferias-vencer"></div>
      </div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
  requireAuth();
  mountShell('dashboard');

  async function load() {
    showLoading();
    try {
      const d = await api('/reports/dashboard');
      document.getElementById('competencia').textContent = `Competência: ${fmt.competencia(d.competencia.mes, d.competencia.ano)}`;

      // KPIs
      const k = d.folha_do_mes;
      document.getElementById('kpis').innerHTML = `
        <div class="kpi">
          <div class="kpi-label">Funcionários ativos</div>
          <div class="kpi-value">${d.funcionarios_ativos}</div>
          <div class="kpi-meta">cadastrados no sistema</div>
        </div>
        <div class="kpi success">
          <div class="kpi-label">Folha líquida do mês</div>
          <div class="kpi-value">${fmt.brl(k.total_liquido)}</div>
          <div class="kpi-meta">${k.qtd_holerites} holerite(s) gerado(s)</div>
        </div>
        <div class="kpi warning">
          <div class="kpi-label">Encargos do mês</div>
          <div class="kpi-value">${fmt.brl(k.inss + k.irrf + k.fgts)}</div>
          <div class="kpi-meta">INSS + IRRF + FGTS</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Holerites enviados</div>
          <div class="kpi-value">${d.holerites_enviados}</div>
          <div class="kpi-meta">de ${k.qtd_holerites} gerados</div>
        </div>
      `;

      // Encargos
      document.getElementById('encargos').innerHTML = `
        <div class="info-row"><div class="label">INSS (folha)</div><div class="value">${fmt.brl(k.inss)}</div></div>
        <div class="info-row"><div class="label">IRRF retido</div><div class="value">${fmt.brl(k.irrf)}</div></div>
        <div class="info-row"><div class="label">FGTS (depósito)</div><div class="value">${fmt.brl(k.fgts)}</div></div>
        <div class="info-row"><div class="label">Proventos totais</div><div class="value">${fmt.brl(k.total_proventos)}</div></div>
        <div class="info-row"><div class="label">Descontos totais</div><div class="value">${fmt.brl(k.total_descontos)}</div></div>
      `;

      // Aniversariantes
      const ani = d.aniversariantes || [];
      document.getElementById('aniversariantes').innerHTML = ani.length
        ? '<ul class="timeline">' + ani.map(a => `
            <li><div class="ts-date">Dia ${String(a.dia).padStart(2,'0')}</div>
            <div class="ts-title">${a.nome_completo}</div>
            <div class="ts-meta">${a.matricula}</div></li>`).join('') + '</ul>'
        : '<p class="text-muted">Nenhum aniversariante este mês.</p>';

      // Férias
      const fer = d.ferias_a_vencer || [];
      document.getElementById('ferias-vencer').innerHTML = fer.length
        ? '<ul class="timeline">' + fer.slice(0, 6).map(f => `
            <li><div class="ts-date">Vence ${fmt.data(f.periodo_aquisitivo_fim)}</div>
            <div class="ts-title">${f.employees?.nome_completo || ''}</div>
            <div class="ts-meta">${f.employees?.matricula || ''} · Período: ${fmt.data(f.periodo_aquisitivo_inicio)}</div></li>`).join('') + '</ul>'
        : '<p class="text-muted">Nenhuma férias a vencer nos próximos 60 dias.</p>';

      // Insights automáticos
      gerarInsights(d);

      // Gráfico premium
      drawChart(d.historico_folha);
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      hideLoading();
    }
  }

  function gerarInsights(d) {
    const ins = [];
    const k = d.folha_do_mes;
    const ativos = d.funcionarios_ativos || 1;
    const hist = d.historico_folha || [];
    const fer = d.ferias_a_vencer || [];

    // Variação da folha
    if (hist.length >= 2) {
      const atual = hist[hist.length - 1].total;
      const anterior = hist[hist.length - 2].total;
      const variacao = anterior > 0 ? ((atual - anterior) / anterior) * 100 : 0;
      if (Math.abs(variacao) > 5) {
        ins.push({
          tipo: variacao > 0 ? 'warn' : 'success',
          titulo: variacao > 0 ? `Folha cresceu ${variacao.toFixed(1)}% vs mês anterior` : `Folha reduziu ${Math.abs(variacao).toFixed(1)}% vs mês anterior`,
          texto: variacao > 0 ? 'Variação relevante — verifique novas contratações, reajustes ou HE.' : 'Redução pode indicar desligamentos. Confira o módulo de turnover.',
        });
      }
    }
    // Holerites pendentes de envio
    if (k.qtd_holerites > 0 && d.holerites_enviados < k.qtd_holerites) {
      ins.push({ tipo: 'warn',
        titulo: `${k.qtd_holerites - d.holerites_enviados} holerite(s) ainda não enviado(s)`,
        texto: 'Envie pelos canais cadastrados em Envios e Agendamentos.' });
    }
    // Férias vencidas/perto do limite
    if (fer.length > 0) {
      ins.push({ tipo: 'danger',
        titulo: `${fer.length} funcionário(s) com férias a vencer`,
        texto: 'Programe os próximos gozos pra evitar passivo trabalhista (multa em dobro).' });
    }
    // Custo médio
    if (ativos > 0 && k.total_liquido > 0) {
      const medio = k.total_liquido / ativos;
      ins.push({ tipo: 'info',
        titulo: `Folha líquida média por funcionário: ${fmt.brl(medio)}`,
        texto: `${ativos} funcionário(s) ativo(s) · ${k.qtd_holerites} holerites no mês.` });
    }
    document.getElementById('insights').innerHTML = ins.length
      ? ins.map(i => `<div class="insight ${i.tipo}"><div class="ico">${i.tipo === 'danger' ? '!' : i.tipo === 'warn' ? '⚠' : i.tipo === 'success' ? '✓' : 'i'}</div><div class="body"><h4>${i.titulo}</h4><p>${i.texto}</p></div></div>`).join('')
      : '';
  }

  let _chart;
  function drawChart(data) {
    if (!data?.length || !window.Chart) return;
    const ctx = document.getElementById('chart');
    _chart?.destroy();
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const styles = getComputedStyle(document.documentElement);
    const brand = styles.getPropertyValue('--brand-500').trim() || '#1FAB54';
    const ink = isDark ? '#C9D1D9' : '#425466';
    const grid = isDark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.06)';
    _chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.map(d => d.label),
        datasets: [{
          label: 'Folha bruta',
          data: data.map(d => d.total),
          backgroundColor: brand,
          borderRadius: 6,
          maxBarThickness: 48,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmt.brl(c.parsed.y) } } },
        scales: {
          x: { grid: { display: false }, ticks: { color: ink } },
          y: { grid: { color: grid }, ticks: { color: ink, callback: v => 'R$ ' + (v/1000).toFixed(0) + 'k' } },
        },
      },
    });
  }

  // Redraw em mudança de tema
  new MutationObserver(() => { drawChart(window._lastHist); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  const _origLoad = load;
  load = async function() { await _origLoad(); };
  load();
</script>
</body>
</html>
