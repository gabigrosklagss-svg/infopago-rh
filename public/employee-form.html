<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funcionário — InfoPago RH</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="page-header">
      <div><h1 id="title">Novo funcionário</h1>
        <p class="subtitle">Campos com <span style="color:var(--danger)">*</span> são obrigatórios</p>
      </div>
      <div class="flex gap-2">
        <a href="/employees.html" class="btn">← Voltar</a>
        <button class="btn btn-primary" onclick="salvar()">💾 Salvar</button>
      </div>
    </div>

    <form id="form">
      <div class="tabs">
        <button type="button" class="tab-btn active" onclick="goTab(0, this)">1. Pessoal</button>
        <button type="button" class="tab-btn" onclick="goTab(1, this)">2. Trabalho & Salário</button>
        <button type="button" class="tab-btn" onclick="goTab(2, this)">3. Benefícios</button>
        <button type="button" class="tab-btn" onclick="goTab(3, this)">4. Bancário</button>
      </div>

      <!-- ── 1. Pessoal ─────────────────────────────────── -->
      <div class="tab-content active card">
        <h3 class="card-title">Foto e Identificação</h3>

        <!-- Foto do funcionário -->
        <div class="flex gap-4 items-center mb-4" id="photo-area" style="padding-bottom:16px;border-bottom:1px solid var(--border)">
          <div id="photo-preview" class="avatar-md" style="width:96px;height:96px;font-size:28px;flex-shrink:0">?</div>
          <div class="flex-1">
            <label style="font-weight:600;font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px">Foto do funcionário</label>
            <p class="text-muted text-sm" style="margin:0 0 8px">JPG, PNG ou WebP · máx. 5 MB</p>
            <div class="flex gap-2">
              <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp" style="display:none">
              <button type="button" class="btn btn-sm" onclick="document.getElementById('photo-input').click()">📷 Selecionar foto</button>
              <button type="button" class="btn btn-sm btn-ghost hidden" id="photo-remove">Remover</button>
            </div>
          </div>
        </div>

        <div class="form-grid">
          <div class="field"><label>Matrícula <small class="text-muted">(auto)</small></label><input name="matricula" placeholder="Gerada automaticamente"></div>
          <div class="field"><label>Nome completo<span class="req">*</span></label><input name="nome_completo" required></div>
          <div class="field"><label>CPF<span class="req">*</span></label><input name="cpf" required data-mask="cpf" placeholder="000.000.000-00"></div>
          <div class="field"><label>RG</label><input name="rg"></div>
          <div class="field"><label>Órgão emissor</label><input name="rg_orgao_emissor" placeholder="SSP"></div>
          <div class="field"><label>UF do RG</label><input name="rg_uf" maxlength="2"></div>
          <div class="field"><label>PIS/PASEP</label><input name="pis_pasep"></div>
          <div class="field"><label>CTPS</label><input name="ctps"></div>
          <div class="field"><label>Série CTPS</label><input name="ctps_serie"></div>
        </div>

        <h3 class="card-title mt-5">Pessoais</h3>
        <div class="form-grid">
          <div class="field"><label>Data de nascimento<span class="req">*</span></label><input type="date" name="data_nascimento" required></div>
          <div class="field"><label>Sexo</label><select name="sexo"><option value="">—</option><option value="M">Masculino</option><option value="F">Feminino</option></select></div>
          <div class="field"><label>Est. civil</label><select name="estado_civil"><option value="">—</option><option value="solteiro">Solteiro</option><option value="casado">Casado</option><option value="divorciado">Divorciado</option><option value="viuvo">Viúvo</option><option value="uniao_estavel">União Estável</option></select></div>
          <div class="field"><label>Escolaridade</label><input name="escolaridade"></div>
          <div class="field"><label>Nacionalidade</label><input name="nacionalidade" value="Brasileiro(a)"></div>
          <div class="field"><label>Naturalidade</label><input name="naturalidade"></div>
          <div class="field"><label>Nome da mãe</label><input name="nome_mae"></div>
          <div class="field"><label>Nome do pai</label><input name="nome_pai"></div>
          <div class="field"><label>Dependentes IRRF</label><input type="number" name="num_dependentes" value="0" min="0"></div>
          <div class="field"><label>Filhos p/ sal. família</label><input type="number" name="num_filhos_salario_familia" value="0" min="0"></div>
        </div>

        <h3 class="card-title mt-5">Contato</h3>
        <div class="form-grid">
          <div class="field"><label>E-mail pessoal</label><input type="email" name="email_pessoal"></div>
          <div class="field"><label>E-mail corporativo</label><input type="email" name="email_corporativo"></div>
          <div class="field"><label>Celular</label><input name="celular" data-mask="telefone"></div>
          <div class="field"><label>Telefone</label><input name="telefone" data-mask="telefone"></div>
        </div>

        <h3 class="card-title mt-5">Endereço</h3>
        <div class="form-grid">
          <div class="field"><label>CEP</label><input name="cep" data-mask="cep" onblur="onCEP(this.value)"></div>
          <div class="field" style="grid-column:span 2"><label>Logradouro</label><input name="logradouro"></div>
          <div class="field"><label>Número</label><input name="numero"></div>
          <div class="field"><label>Complemento</label><input name="complemento"></div>
          <div class="field"><label>Bairro</label><input name="bairro"></div>
          <div class="field"><label>Cidade</label><input name="cidade"></div>
          <div class="field"><label>UF</label><input name="uf" maxlength="2"></div>
        </div>
      </div>

      <!-- ── 2. Trabalho ─────────────────────────────────── -->
      <div class="tab-content card">
        <h3 class="card-title">Vínculo</h3>
        <div class="form-grid">
          <div class="field"><label>Admissão<span class="req">*</span></label><input type="date" name="data_admissao" required></div>
          <div class="field"><label>Tipo de contrato</label><select name="tipo_contrato"><option value="clt">CLT</option><option value="pj">PJ</option><option value="estagio">Estágio</option><option value="temporario">Temporário</option><option value="aprendiz">Aprendiz</option></select></div>
          <div class="field"><label>Regime</label><select name="regime_trabalho"><option value="mensalista">Mensalista</option><option value="horista">Horista</option><option value="comissionado">Comissionado</option></select></div>
          <div class="field"><label>Carga semanal (h)</label><input type="number" name="carga_horaria_semanal" value="44"></div>
          <div class="field"><label>Status</label><select name="status"><option value="ativo">Ativo</option><option value="afastado">Afastado</option><option value="ferias">Em férias</option></select></div>
        </div>

        <h3 class="card-title mt-5">Cargo / Departamento</h3>
        <div class="form-grid">
          <div class="field"><label>Departamento</label><select name="department_id" id="sel-dept"><option value="">—</option></select></div>
          <div class="field"><label>Cargo</label><select name="position_id" id="sel-pos"><option value="">—</option></select></div>
          <div class="field"><label>Gestor direto</label><select name="gestor_id" id="sel-gestor"><option value="">—</option></select></div>
          <div class="field"><label>Setor</label><input name="setor"></div>
          <div class="field"><label>Seção</label><input name="secao"></div>
          <div class="field"><label>Filial</label><input name="filial"></div>
          <div class="field"><label>Local de trabalho</label><input name="local_trabalho"></div>
        </div>

        <h3 class="card-title mt-5">Salário</h3>
        <div class="form-grid">
          <div class="field"><label>Salário base (R$)<span class="req">*</span></label><input type="number" name="salario_base" step="0.01" required></div>
          <div class="field"><label>Motivo (em caso de reajuste)</label><input name="motivo_reajuste" placeholder="Promoção, dissídio..."></div>
        </div>
      </div>

      <!-- ── 3. Benefícios ──────────────────────────────── -->
      <div class="tab-content card">
        <h3 class="card-title">Benefícios</h3>
        <div class="grid-2">
          <div class="card">
            <label class="toggle"><input type="checkbox" name="tem_vt"><span class="slider"></span> <strong>Vale-Transporte</strong></label>
            <div class="form-grid mt-3">
              <div class="field"><label>Valor/dia</label><input type="number" name="vt_valor_dia" step="0.01" value="0"></div>
              <div class="field"><label>Dias úteis</label><input type="number" name="vt_dias_uteis" value="22"></div>
            </div>
          </div>
          <div class="card">
            <label class="toggle"><input type="checkbox" name="tem_vr"><span class="slider"></span> <strong>Vale-Refeição</strong></label>
            <div class="form-grid mt-3">
              <div class="field"><label>Valor/dia</label><input type="number" name="vr_valor_dia" step="0.01" value="0"></div>
              <div class="field"><label>Dias úteis</label><input type="number" name="vr_dias_uteis" value="22"></div>
            </div>
          </div>
          <div class="card">
            <label class="toggle"><input type="checkbox" name="tem_va"><span class="slider"></span> <strong>Vale-Alimentação</strong></label>
            <div class="form-grid mt-3">
              <div class="field"><label>Valor/mês</label><input type="number" name="va_valor_mes" step="0.01" value="0"></div>
            </div>
          </div>
          <div class="card">
            <label class="toggle"><input type="checkbox" name="tem_plano_saude"><span class="slider"></span> <strong>Plano de Saúde</strong></label>
            <div class="form-grid mt-3">
              <div class="field"><label>Valor desconto/mês</label><input type="number" name="plano_saude_valor" step="0.01" value="0"></div>
            </div>
          </div>
          <div class="card">
            <label class="toggle"><input type="checkbox" name="tem_plano_odonto"><span class="slider"></span> <strong>Plano Odontológico</strong></label>
            <div class="form-grid mt-3">
              <div class="field"><label>Valor desconto/mês</label><input type="number" name="plano_odonto_valor" step="0.01" value="0"></div>
            </div>
          </div>
          <div class="card">
            <label class="toggle"><input type="checkbox" name="tem_seguro_vida"><span class="slider"></span> <strong>Seguro de Vida</strong></label>
            <div class="form-grid mt-3">
              <div class="field"><label>Valor desconto/mês</label><input type="number" name="seguro_vida_valor" step="0.01" value="0"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── 4. Bancário ────────────────────────────────── -->
      <div class="tab-content card">
        <h3 class="card-title">Dados para pagamento</h3>
        <div class="form-grid">
          <div class="field"><label>Forma de pagamento</label><select name="forma_pagamento"><option value="pix">PIX</option><option value="transferencia">Transferência</option><option value="cheque">Cheque</option><option value="dinheiro">Dinheiro</option></select></div>
          <div class="field"><label>Banco (cód.)</label><input name="banco"></div>
          <div class="field"><label>Nome do banco</label><input name="banco_nome"></div>
          <div class="field"><label>Agência</label><input name="agencia"></div>
          <div class="field"><label>Conta</label><input name="conta"></div>
          <div class="field"><label>Tipo de conta</label><select name="tipo_conta"><option value="">—</option><option value="corrente">Corrente</option><option value="poupanca">Poupança</option></select></div>
          <div class="field"><label>Chave PIX</label><input name="chave_pix"></div>
          <div class="field"><label>Tipo PIX</label><select name="tipo_pix"><option value="">—</option><option value="cpf">CPF</option><option value="email">E-mail</option><option value="celular">Celular</option><option value="aleatoria">Aleatória</option></select></div>
        </div>

        <h3 class="card-title mt-5">Observações</h3>
        <textarea name="observacoes" rows="4" style="width:100%"></textarea>
      </div>
    </form>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth();
  mountShell('employees');

  const params = new URLSearchParams(location.search);
  const editId = params.get('id');
  if (editId) document.getElementById('title').textContent = 'Editar funcionário';

  function goTab(idx, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content')[idx].classList.add('active');
  }

  async function carregarSelects() {
    const [depts, pos, emps] = await Promise.all([
      api('/departments?active=true'),
      api('/positions?active=true'),
      api('/employees?status=ativo&limit=300'),
    ]);
    document.getElementById('sel-dept').innerHTML = '<option value="">—</option>' + depts.map(d => `<option value="${d.id}">${d.nome}</option>`).join('');
    document.getElementById('sel-pos').innerHTML  = '<option value="">—</option>' + pos.map(p => `<option value="${p.id}">${p.titulo}${p.nivel ? ' · ' + p.nivel : ''}</option>`).join('');
    document.getElementById('sel-gestor').innerHTML = '<option value="">—</option>' + (emps.data || []).map(e => `<option value="${e.id}">${e.nome_completo}</option>`).join('');
  }

  async function carregarEdicao() {
    if (!editId) return;
    showLoading();
    try {
      const e = await api(`/employees/${editId}`);
      const f = document.getElementById('form');
      fillForm(f, e);
      if (e.foto_url) renderPhotoPreview(e.foto_url);
      else {
        const init = (e.nome_completo || '?').split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase();
        document.getElementById('photo-preview').textContent = init;
      }
    } catch (err) { toast(err.message, 'error'); }
    finally { hideLoading(); }
  }

  function renderPhotoPreview(url) {
    const p = document.getElementById('photo-preview');
    p.innerHTML = `<img src="${url}?t=${Date.now()}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`;
    document.getElementById('photo-remove').classList.remove('hidden');
  }

  /* Upload de foto */
  document.getElementById('photo-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!editId) {
      toast('Salve o funcionário primeiro, depois faça o upload da foto.', 'warning');
      e.target.value = '';
      return;
    }
    const fd = new FormData();
    fd.append('foto', file);
    showLoading();
    try {
      const r = await fetch(`/api/employees/${editId}/foto`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${getToken()}` },
        body: fd,
      });
      if (!r.ok) throw new Error((await r.json()).error || 'Falha no upload');
      const data = await r.json();
      renderPhotoPreview(data.foto_url);
      toast('Foto atualizada!', 'success');
    } catch (err) { toast(err.message, 'error'); }
    finally { hideLoading(); }
  });

  async function onCEP(cep) {
    const d = await buscarCEP(cep);
    if (!d) return;
    const f = document.getElementById('form');
    f.logradouro.value = d.logradouro || '';
    f.bairro.value = d.bairro || '';
    f.cidade.value = d.localidade || '';
    f.uf.value = d.uf || '';
  }

  async function salvar() {
    const f = document.getElementById('form');
    if (!validateForm(f)) {
      // Vai para a primeira tab com erro
      const erro = f.querySelector('.field.error');
      if (erro) {
        const idx = Array.from(document.querySelectorAll('.tab-content')).findIndex(t => t.contains(erro));
        if (idx >= 0) goTab(idx, document.querySelectorAll('.tab-btn')[idx]);
      }
      return;
    }

    const data = formToObject(f);
    showLoading();
    try {
      if (editId) {
        await api(`/employees/${editId}`, { method: 'PUT', body: data });
        toast('Funcionário atualizado!', 'success');
      } else {
        await api('/employees', { method: 'POST', body: data });
        toast('Funcionário cadastrado!', 'success');
        setTimeout(() => location.href = '/employees.html', 800);
      }
    } catch (err) {
      toast(err.message, 'error');
    } finally { hideLoading(); }
  }

  carregarSelects().then(carregarEdicao);
</script>
</body>
</html>
