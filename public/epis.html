<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPIs — InfoPago RH</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="breadcrumb">
      <a href="/dashboard.html">Painel</a>
      <span class="sep">›</span>
      <span>EPIs</span>
    </div>

    <div class="page-header">
      <div>
        <h1>EPIs — Equipamentos de Proteção</h1>
        <p class="subtitle">Catálogo, estoque e entregas para funcionários</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="goTab(0, this)">Catálogo</button>
      <button class="tab-btn" onclick="goTab(1, this)">Entregas</button>
    </div>

    <!-- Catálogo -->
    <div class="tab-content active card">
      <div class="flex justify-between items-center mb-4">
        <h3 style="margin:0">Catálogo de EPIs</h3>
        <button class="btn btn-primary" onclick="novoEpi()">+ Novo EPI</button>
      </div>
      <table class="table">
        <thead><tr><th>EPI</th><th>CA</th><th>Categoria</th><th>Validade</th><th>Estoque</th><th></th></tr></thead>
        <tbody id="tbody-epis"></tbody>
      </table>
    </div>

    <!-- Entregas -->
    <div class="tab-content card">
      <div class="flex justify-between items-center mb-4">
        <h3 style="margin:0">Entregas de EPI</h3>
        <button class="btn btn-primary" onclick="novaEntrega()">+ Nova entrega</button>
      </div>
      <div class="mb-3">
        <input type="search" id="busca-entregas" placeholder="Pesquisar por nome ou matrícula do funcionário..." oninput="filtrarEntregas()" style="width:100%;padding:8px 12px;border:1px solid var(--border-2);border-radius:var(--r-sm);font-family:inherit;font-size:13px">
      </div>
      <table class="table">
        <thead><tr><th>Funcionário</th><th>EPI</th><th>Qtd</th><th>Entrega</th><th>Vencimento</th><th>Ciente</th></tr></thead>
        <tbody id="tbody-entregas"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth();
  mountShell('epis');

  const CATS_EPI = {
    protecao_cabeca:'Cabeça', protecao_olhos:'Olhos', protecao_auditiva:'Auditiva',
    protecao_respiratoria:'Respiratória',
    protecao_membros_superiores:'Mem. Superiores', protecao_membros_inferiores:'Mem. Inferiores',
    protecao_corpo:'Corpo', protecao_queda:'Queda', outros:'Outros'
  };

  function goTab(idx, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content')[idx].classList.add('active');
    if (idx === 0) loadEpis();
    if (idx === 1) loadEntregas();
  }

  async function loadEpis() {
    const list = await api('/epis?ativo=true');
    document.getElementById('tbody-epis').innerHTML = list.length ? list.map(e => `
      <tr>
        <td><strong>${e.nome}</strong>${e.fabricante ? `<br><small class="text-muted">${e.fabricante}</small>` : ''}</td>
        <td><code>${e.ca || '—'}</code></td>
        <td><small>${CATS_EPI[e.categoria] || e.categoria}</small></td>
        <td>${e.validade_meses || '—'} meses</td>
        <td>${e.estoque_atual ?? 0}</td>
        <td><button class="btn btn-sm btn-danger" onclick="excluirEpi('${e.id}')">×</button></td>
      </tr>
    `).join('') : '<tr><td colspan="6" class="table-empty">Nenhum EPI no catálogo.</td></tr>';
  }

  async function novoEpi() {
    const catOpts = Object.entries(CATS_EPI).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
    const html = `<form id="epiForm">
      <div class="form-grid">
        <div class="field" style="grid-column:span 2"><label>Nome<span class="req">*</span></label><input name="nome" required placeholder="Ex: Capacete classe A"></div>
        <div class="field"><label>CA (Certif. Aprovação)</label><input name="ca" placeholder="Ex: 12345"></div>
        <div class="field"><label>Categoria<span class="req">*</span></label><select name="categoria" required>${catOpts}</select></div>
        <div class="field"><label>Fabricante</label><input name="fabricante"></div>
        <div class="field"><label>Validade (meses)</label><input type="number" name="validade_meses" value="12"></div>
        <div class="field"><label>Vida útil (meses)</label><input type="number" name="vida_util_meses" value="6"></div>
        <div class="field"><label>Custo unitário (R$)</label><input type="number" name="custo_unitario" step="0.01"></div>
        <div class="field"><label>Estoque mínimo</label><input type="number" name="estoque_minimo" value="0"></div>
        <div class="field"><label>Estoque atual</label><input type="number" name="estoque_atual" value="0"></div>
      </div>
      <div class="field mt-3"><label>Descrição</label><textarea name="descricao"></textarea></div>
    </form>`;
    showFormModal('Novo EPI', html, async () => {
      const f = document.getElementById('epiForm');
      if (!validateForm(f)) return;
      const d = formToObject(f);
      ['validade_meses','vida_util_meses','estoque_minimo','estoque_atual'].forEach(k => d[k] = parseInt(d[k]) || 0);
      if (d.custo_unitario) d.custo_unitario = parseFloat(d.custo_unitario);
      try { await api('/epis', { method: 'POST', body: d }); toast('EPI cadastrado.', 'success'); closeFormModal(); loadEpis(); }
      catch (err) { toast(err.message, 'error'); }
    });
  }

  async function excluirEpi(id) {
    if (!confirm('Desativar este EPI?')) return;
    await api(`/epis/${id}`, { method: 'DELETE' });
    toast('Desativado.', 'success'); loadEpis();
  }

  let _entregasCache = [];
  async function loadEntregas() {
    _entregasCache = await api('/epis/deliveries/all');
    renderEntregas(_entregasCache);
  }

  function filtrarEntregas() {
    const q = document.getElementById('busca-entregas').value.toLowerCase().trim();
    if (!q) { renderEntregas(_entregasCache); return; }
    const filt = _entregasCache.filter(d =>
      (d.employees?.nome_completo || '').toLowerCase().includes(q) ||
      String(d.employees?.matricula || '').includes(q)
    );
    renderEntregas(filt);
  }

  function renderEntregas(list) {
    document.getElementById('tbody-entregas').innerHTML = list.length ? list.map(d => {
      const vencido = d.data_vencimento && new Date(d.data_vencimento) < new Date();
      return `<tr ${vencido ? 'style="background:var(--danger-bg)"' : ''}>
        <td><strong>${d.employees?.nome_completo}</strong><br><small class="text-muted">${fmt.matricula(d.employees?.matricula)}</small></td>
        <td>${d.epis?.nome}</td>
        <td>${d.quantidade}</td>
        <td>${fmt.data(d.data_entrega)}</td>
        <td>${d.data_vencimento ? fmt.data(d.data_vencimento) + (vencido ? ' (vencido)' : '') : '—'}</td>
        <td>${d.ciencia_funcionario ? 'Sim' : 'Não'}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="6" class="table-empty">Nenhuma entrega encontrada.</td></tr>';
  }

  async function novaEntrega() {
    const [emps, epis] = await Promise.all([
      api('/employees?status=ativo&limit=300'),
      api('/epis?ativo=true'),
    ]);
    const empOpts = (emps.data || []).map(e => `<option value="${e.id}">${e.nome_completo}</option>`).join('');
    const epiOpts = epis.map(e => `<option value="${e.id}">${e.nome}${e.ca ? ' (CA ' + e.ca + ')' : ''}</option>`).join('');
    const html = `<form id="entForm">
      <div class="form-grid">
        <div class="field" style="grid-column:span 2"><label>Funcionário<span class="req">*</span></label><select name="employee_id" required>${empOpts}</select></div>
        <div class="field" style="grid-column:span 2"><label>EPI<span class="req">*</span></label><select name="epi_id" required>${epiOpts}</select></div>
        <div class="field"><label>Quantidade</label><input type="number" name="quantidade" value="1" min="1"></div>
        <div class="field"><label>Data entrega<span class="req">*</span></label><input type="date" name="data_entrega" required value="${new Date().toISOString().split('T')[0]}"></div>
        <div class="field"><label>Motivo</label>
          <select name="motivo">
            <option value="admissao">Admissão</option>
            <option value="substituicao_periodica">Substituição periódica</option>
            <option value="substituicao_avaria">Substituição por avaria</option>
            <option value="perda">Perda</option>
            <option value="obrigatorio_funcao">Obrigatório à função</option>
            <option value="outros">Outros</option>
          </select></div>
      </div>
      <label class="toggle mt-3"><input type="checkbox" name="ciencia_funcionario"><span class="slider"></span> Funcionário ciente / assinou</label>
      <div class="field mt-3"><label>Observações</label><textarea name="observacoes"></textarea></div>
    </form>`;
    showFormModal('Nova entrega de EPI', html, async () => {
      const f = document.getElementById('entForm');
      if (!validateForm(f)) return;
      const d = formToObject(f);
      d.quantidade = parseInt(d.quantidade) || 1;
      d.ciencia_funcionario = !!d.ciencia_funcionario;
      try { await api('/epis/deliveries', { method: 'POST', body: d }); toast('Entrega registrada.', 'success'); closeFormModal(); loadEntregas(); loadEpis(); }
      catch (err) { toast(err.message, 'error'); }
    });
  }

  function showFormModal(title, html, onSave) {
    let m = document.getElementById('form-modal');
    if (!m) { m = document.createElement('div'); m.id = 'form-modal'; m.className = 'modal-overlay'; m.onclick = (e) => { if (e.target === m) closeFormModal(); }; document.body.appendChild(m); }
    m.innerHTML = `<div class="modal modal-lg"><div class="modal-header"><h2>${title}</h2><button class="modal-close" onclick="closeFormModal()">×</button></div><div class="modal-body">${html}</div><div class="modal-footer"><button class="btn" onclick="closeFormModal()">Cancelar</button><button class="btn btn-primary" id="form-save">Salvar</button></div></div>`;
    m.classList.remove('hidden');
    document.getElementById('form-save').onclick = onSave;
  }
  function closeFormModal() { document.getElementById('form-modal')?.remove(); }

  loadEpis();
</script>
</body>
</html>
