<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holerites — InfoPago RH</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  /* Tabela compacta para caber sem scroll horizontal */
  .table-wrap.compact .table { font-size: 12px; table-layout: fixed; width: 100%; }
  .table-wrap.compact .table th,
  .table-wrap.compact .table td { padding: 8px 8px; vertical-align: middle; }
  .table-wrap.compact .table th:nth-child(1),
  .table-wrap.compact .table td:nth-child(1) { width: 28px; padding: 8px 4px; }
  .table-wrap.compact .table th:nth-child(2),
  .table-wrap.compact .table td:nth-child(2) { width: 80px; }
  .table-wrap.compact .table th:nth-child(3),
  .table-wrap.compact .table td:nth-child(3) { width: auto; }
  .table-wrap.compact .table th:nth-child(4),
  .table-wrap.compact .table td:nth-child(4),
  .table-wrap.compact .table th:nth-child(5),
  .table-wrap.compact .table td:nth-child(5) { width: 90px; text-align: right; }
  .table-wrap.compact .table th:nth-child(6),
  .table-wrap.compact .table td:nth-child(6) { width: 140px; font-size: 11px; }
  .table-wrap.compact .table th:nth-child(7),
  .table-wrap.compact .table td:nth-child(7) { width: 80px; }
  .table-wrap.compact .table th:nth-child(8),
  .table-wrap.compact .table td:nth-child(8) { width: 80px; }
  .table-wrap.compact .table th:nth-child(9),
  .table-wrap.compact .table td:nth-child(9) { width: 60px; padding: 4px; }

  /* Botão de ações compacto: dropdown */
  .acoes-wrap { position: relative; display: inline-block; }
  .btn-acoes {
    background: transparent; border: 1px solid var(--border-2);
    padding: 4px 8px; border-radius: var(--r-sm);
    cursor: pointer; font-family: inherit; font-size: 14px;
    color: var(--ink-2);
    transition: all var(--t-fast);
    line-height: 1;
  }
  .btn-acoes:hover { background: var(--paper-3); border-color: var(--brand-500); color: var(--brand-700); }
  .acoes-menu {
    position: absolute; right: 0; top: 100%;
    background: var(--paper); border: 1px solid var(--border);
    border-radius: var(--r-sm); box-shadow: var(--sh-3);
    min-width: 160px; z-index: 100;
    padding: 4px;
    display: none;
  }
  .acoes-wrap.open .acoes-menu { display: block; }
  .acoes-menu button, .acoes-menu a {
    display: block; width: 100%;
    background: transparent; border: 0;
    padding: 8px 12px; text-align: left;
    font-family: inherit; font-size: 12.5px;
    color: var(--ink-2);
    border-radius: var(--r-xs);
    cursor: pointer;
    text-decoration: none;
  }
  .acoes-menu button:hover, .acoes-menu a:hover { background: var(--brand-50); color: var(--brand-800); }
  .acoes-menu .danger { color: var(--danger); }
  .acoes-menu .danger:hover { background: var(--danger-bg); color: var(--danger); }
  .acoes-menu .separator { height: 1px; background: var(--border); margin: 4px 0; }

  .nome-cell { overflow: hidden; }
  .nome-cell strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nome-cell small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="page-header">
      <div><h1>Holerites</h1><p class="subtitle">Geração individual, em lote, PDFs e envio por e-mail</p></div>
      <div class="flex gap-2">
        <button class="btn" onclick="modalIndividual()">+ Gerar individual</button>
        <button class="btn btn-primary" onclick="modalLote()">+ Gerar em lote</button>
      </div>
    </div>

    <div class="filter-bar">
      <div class="field"><label>Mês</label><select id="f-mes"></select></div>
      <div class="field"><label>Ano</label><select id="f-ano"></select></div>
      <div class="field"><label>Status</label>
        <select id="f-status" onchange="carregar()">
          <option value="">Todos</option>
          <option value="rascunho">Rascunho</option>
          <option value="gerado">Gerado</option>
          <option value="enviado">Enviado</option>
          <option value="confirmado">Confirmado</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="carregar()"> Filtrar</button>
      <button class="btn" onclick="gerarPDFsLote()"> PDFs (selecionados)</button>
      <button class="btn btn-success" onclick="enviarLote()"> Enviar (selecionados)</button>
    </div>

    <div class="table-wrap compact">
      <table class="table">
        <thead>
          <tr>
            <th><input type="checkbox" id="check-all" onclick="toggleAll(this)"></th>
            <th>Competência</th>
            <th>Funcionário</th>
            <th>Bruto</th>
            <th>Líquido</th>
            <th>INSS / IRRF / FGTS</th>
            <th>Status</th>
            <th>Pagamento</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth();
  mountShell('payslips');

  // Selects mes/ano
  const now = new Date();
  const mes = now.getMonth() + 1;
  const ano = now.getFullYear();
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  document.getElementById('f-mes').innerHTML = meses.map((m, i) => `<option value="${i+1}" ${i+1 === mes ? 'selected' : ''}>${m}</option>`).join('');
  const anos = [];
  for (let a = ano + 1; a >= ano - 3; a--) anos.push(a);
  document.getElementById('f-ano').innerHTML = anos.map(a => `<option value="${a}" ${a === ano ? 'selected' : ''}>${a}</option>`).join('');

  async function carregar() {
    showLoading();
    try {
      const q = new URLSearchParams({
        mes: document.getElementById('f-mes').value,
        ano: document.getElementById('f-ano').value,
      });
      const status = document.getElementById('f-status').value;
      if (status) q.set('status', status);
      const r = await api(`/payslips?${q}`);

      const tbody = document.getElementById('tbody');
      if (!r.data?.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="table-empty">Nenhum holerite encontrado para esta competência.</td></tr>';
        return;
      }

      tbody.innerHTML = r.data.map(p => `
        <tr>
          <td><input type="checkbox" class="sel" value="${p.id}"></td>
          <td><strong>${fmt.competencia(p.competencia_mes, p.competencia_ano)}</strong></td>
          <td class="nome-cell">
            <strong>${p.employees?.nome_completo || ''}</strong>
            <small class="text-muted">${fmt.matricula(p.employees?.matricula)} · ${p.employees?.departments?.nome || ''}</small>
          </td>
          <td>${fmt.brl(p.total_proventos)}</td>
          <td><strong>${fmt.brl(p.salario_liquido)}</strong></td>
          <td><small>${fmt.brl(p.inss_valor)} / ${fmt.brl(p.irrf_valor)} / ${fmt.brl(p.fgts_valor)}</small></td>
          <td><span class="badge ${p.status}">${p.status}</span></td>
          <td>${fmt.data(p.data_pagamento)}</td>
          <td>
            <div class="acoes-wrap">
              <button class="btn-acoes" onclick="toggleAcoes(event, this)" title="Ações">⋯</button>
              <div class="acoes-menu" onclick="event.stopPropagation()">
                <a href="/payslip-view.html?id=${p.id}">Ver detalhes</a>
                <button onclick="gerarPDF('${p.id}')">${p.pdf_path ? 'Regerar PDF' : 'Gerar PDF'}</button>
                ${p.pdf_path ? `<button onclick="downloadAuth('/api/payslips/${p.id}/download', 'Holerite_${(p.employees?.nome_completo || '').split(' ')[0]}_${p.competencia_mes}_${p.competencia_ano}.pdf')">Baixar PDF</button>` : ''}
                ${p.pdf_path ? `<button onclick="enviar('${p.id}')">Enviar e-mail</button>` : ''}
                <div class="separator"></div>
                <button class="danger" onclick="excluir('${p.id}', '${(p.employees?.nome_completo || '').replace(/'/g, '\\\'')}', '${fmt.competencia(p.competencia_mes, p.competencia_ano)}')">Excluir</button>
              </div>
            </div>
          </td>
        </tr>
      `).join('');
    } catch (err) { toast(err.message, 'error'); }
    finally { hideLoading(); }
  }

  function toggleAll(c) {
    document.querySelectorAll('.sel').forEach(s => s.checked = c.checked);
  }

  function getSelecionados() {
    return [...document.querySelectorAll('.sel:checked')].map(s => s.value);
  }

  /* ── Dropdown de ações ─────────────────────────────── */
  function toggleAcoes(ev, btn) {
    ev.stopPropagation();
    const wrap = btn.parentElement;
    const wasOpen = wrap.classList.contains('open');
    // Fecha qualquer outro dropdown aberto
    document.querySelectorAll('.acoes-wrap.open').forEach(w => w.classList.remove('open'));
    if (!wasOpen) {
      wrap.classList.add('open');
      // Fecha ao clicar fora
      setTimeout(() => document.addEventListener('click', () => wrap.classList.remove('open'), { once: true }), 0);
    }
  }

  async function gerarPDF(id) {
    showLoading();
    try {
      await api(`/payslips/${id}/gerar-pdf`, { method: 'POST' });
      toast('PDF gerado!', 'success');
      carregar();
    } catch (err) { toast(err.message, 'error'); }
    finally { hideLoading(); }
  }

  async function excluir(id, nome, competencia) {
    if (!confirm(`Excluir o holerite de ${nome} (${competencia}) permanentemente?\n\nIsso vai apagar também o PDF e os registros de envio.`)) return;
    showLoading();
    try {
      await api(`/payslips/${id}`, { method: 'DELETE' });
      toast('Holerite excluído.', 'success');
      carregar();
    } catch (err) { toast(err.message, 'error'); }
    finally { hideLoading(); }
  }

  async function enviar(id) {
    if (!confirm('Enviar holerite por e-mail ao funcionário?')) return;
    showLoading();
    try {
      const r = await api(`/email/send/${id}`, { method: 'POST' });
      toast(`Enviado para ${r.recipient}`, 'success');
      carregar();
    } catch (err) { toast(err.message, 'error'); }
    finally { hideLoading(); }
  }

  async function gerarPDFsLote() {
    const ids = getSelecionados();
    if (!ids.length) { toast('Selecione ao menos um holerite.', 'warning'); return; }
    showLoading();
    try {
      const r = await api('/payslips/lote/gerar-pdf', { method: 'POST', body: { payslip_ids: ids } });
      toast(`${r.gerados} PDFs gerados (${r.erros} erros)`, r.erros ? 'warning' : 'success');
      carregar();
    } catch (err) { toast(err.message, 'error'); }
    finally { hideLoading(); }
  }

  async function enviarLote() {
    const ids = getSelecionados();
    if (!ids.length) { toast('Selecione ao menos um holerite.', 'warning'); return; }
    if (!confirm(`Enviar ${ids.length} holerite(s) por e-mail?`)) return;
    showLoading();
    try {
      const r = await api('/email/send-batch', { method: 'POST', body: { payslip_ids: ids } });
      toast(`${r.enviados} enviado(s), ${r.erros} erro(s)`, r.erros ? 'warning' : 'success');
      carregar();
    } catch (err) { toast(err.message, 'error'); }
    finally { hideLoading(); }
  }

  /* ── Modal Individual (um funcionário) ───────────── */
  async function modalIndividual() {
    const emps = await api('/employees?status=ativo&limit=300');
    const opcoesEmp = (emps.data || []).map(e =>
      `<option value="${e.id}">${fmt.matricula(e.matricula)} · ${e.nome_completo} · ${fmt.brl(e.salario_base)}</option>`
    ).join('');

    if (!opcoesEmp) {
      toast('Nenhum funcionário ativo. Cadastre um primeiro.', 'warning');
      return;
    }

    const html = `<form id="indForm">
      <div class="form-grid">
        <div class="field" style="grid-column:span 2"><label>Funcionário<span class="req">*</span></label>
          <select name="employee_id" required>${opcoesEmp}</select></div>
        <div class="field"><label>Mês<span class="req">*</span></label>
          <select name="competencia_mes" required>${meses.map((m,i)=>`<option value="${i+1}" ${i+1===mes?'selected':''}>${m}</option>`).join('')}</select></div>
        <div class="field"><label>Ano<span class="req">*</span></label>
          <select name="competencia_ano" required>${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select></div>
        <div class="field"><label>Data pagamento<span class="req">*</span></label><input type="date" name="data_pagamento" required></div>
        <div class="field"><label>Dias trabalhados</label><input type="number" name="dias_trabalhados" value="30"></div>
      </div>

      <div style="background:var(--brand-50);border-left:3px solid var(--brand-500);padding:10px 14px;border-radius:var(--r-sm);margin-top:16px;font-size:12px;line-height:1.5">
        <strong style="color:var(--brand-800)">Cálculo automático:</strong> As horas extras 50% e 100% são calculadas a partir do controle de ponto deste funcionário (sábado 50%, domingo/feriado 100%, excesso da carga diária 50%).
      </div>

      <h4 class="mt-4">Lançamentos avulsos (opcional)</h4>
      <div class="form-grid">
        <div class="field"><label>Adic. Noturno (h)</label><input type="number" name="adicional_noturno_horas" value="0" step="0.5"></div>
        <div class="field"><label>Adic. Insalubridade (R$)</label><input type="number" name="adicional_insalubridade" value="0" step="0.01"></div>
        <div class="field"><label>Adic. Periculosidade (R$)</label><input type="number" name="adicional_periculosidade" value="0" step="0.01"></div>
        <div class="field"><label>Comissões (R$)</label><input type="number" name="comissoes" value="0" step="0.01"></div>
        <div class="field"><label>Bônus (R$)</label><input type="number" name="bonus" value="0" step="0.01"></div>
        <div class="field"><label>Gratificação (R$)</label><input type="number" name="gratificacao" value="0" step="0.01"></div>
        <div class="field"><label>13º proporcional (R$)</label><input type="number" name="decimo_terceiro" value="0" step="0.01"></div>
        <div class="field"><label>Férias (R$)</label><input type="number" name="ferias_valor" value="0" step="0.01"></div>
        <div class="field"><label>1/3 férias (R$)</label><input type="number" name="ferias_um_terco" value="0" step="0.01"></div>
        <div class="field"><label>Outros proventos (R$)</label><input type="number" name="outros_proventos" value="0" step="0.01"></div>
        <div class="field"><label>Descrição outros proventos</label><input name="outros_proventos_desc" placeholder="Ex: Premiação"></div>
      </div>

      <h4 class="mt-4">Descontos avulsos (opcional)</h4>
      <div class="form-grid">
        <div class="field"><label>Faltas (dias)</label><input type="number" name="faltas_dias" value="0" min="0"></div>
        <div class="field"><label>Pensão alimentícia (R$)</label><input type="number" name="pensao_alimenticia" value="0" step="0.01"></div>
        <div class="field"><label>Adiantamento (R$)</label><input type="number" name="adiantamento" value="0" step="0.01"></div>
        <div class="field"><label>Outros descontos (R$)</label><input type="number" name="outros_descontos" value="0" step="0.01"></div>
        <div class="field"><label>Descrição outros descontos</label><input name="outros_descontos_desc" placeholder="Ex: Empréstimo"></div>
      </div>

      <div class="field mt-4"><label>Observações no holerite</label><textarea name="observacoes" placeholder="Texto livre que aparecerá no PDF"></textarea></div>
    </form>`;

    showFormModal('Gerar holerite individual', html, async () => {
      const f = document.getElementById('indForm');
      if (!validateForm(f)) return;
      const data = formToObject(f);

      const payload = {
        employee_id: data.employee_id,
        competencia_mes: parseInt(data.competencia_mes),
        competencia_ano: parseInt(data.competencia_ano),
        data_pagamento: data.data_pagamento,
        lancamentos: {
          dias_trabalhados: parseInt(data.dias_trabalhados) || 30,
          adicional_noturno_horas: parseFloat(data.adicional_noturno_horas) || 0,
          adicional_insalubridade: parseFloat(data.adicional_insalubridade) || 0,
          adicional_periculosidade: parseFloat(data.adicional_periculosidade) || 0,
          comissoes: parseFloat(data.comissoes) || 0,
          bonus: parseFloat(data.bonus) || 0,
          gratificacao: parseFloat(data.gratificacao) || 0,
          decimo_terceiro: parseFloat(data.decimo_terceiro) || 0,
          ferias_valor: parseFloat(data.ferias_valor) || 0,
          ferias_um_terco: parseFloat(data.ferias_um_terco) || 0,
          outros_proventos: parseFloat(data.outros_proventos) || 0,
          outros_proventos_desc: data.outros_proventos_desc || '',
          faltas_dias: parseInt(data.faltas_dias) || 0,
          pensao_alimenticia: parseFloat(data.pensao_alimenticia) || 0,
          adiantamento: parseFloat(data.adiantamento) || 0,
          outros_descontos: parseFloat(data.outros_descontos) || 0,
          outros_descontos_desc: data.outros_descontos_desc || '',
          observacoes: data.observacoes || '',
        },
      };

      showLoading();
      try {
        const r = await api('/payslips', { method: 'POST', body: payload });
        toast(`Holerite gerado · líquido ${fmt.brl(r.salario_liquido)}`, 'success', `${meses[r.competencia_mes-1]}/${r.competencia_ano}`);
        closeFormModal();
        carregar();
      } catch (err) { toast(err.message, 'error'); }
      finally { hideLoading(); }
    });
  }

  /* ── Modal Lote ───────────────────────────────────── */
  async function modalLote() {
    const depts = await api('/departments?active=true');
    const html = `<form id="loteForm">
      <div class="form-grid">
        <div class="field"><label>Mês<span class="req">*</span></label>
          <select name="competencia_mes" required>${meses.map((m,i)=>`<option value="${i+1}" ${i+1===mes?'selected':''}>${m}</option>`).join('')}</select></div>
        <div class="field"><label>Ano<span class="req">*</span></label>
          <select name="competencia_ano" required>${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select></div>
        <div class="field"><label>Data pagamento<span class="req">*</span></label><input type="date" name="data_pagamento" required></div>
        <div class="field"><label>Departamento (opcional)</label>
          <select name="department_id"><option value="">Todos os ativos</option>${depts.map(d=>`<option value="${d.id}">${d.nome}</option>`).join('')}</select></div>
      </div>
      <div style="background:var(--brand-50);border-left:3px solid var(--brand-500);padding:10px 14px;border-radius:var(--r-sm);margin-top:16px;font-size:12px;line-height:1.5">
        <strong style="color:var(--brand-800)"> Cálculo automático:</strong> As <strong>horas extras 50% e 100%</strong> são calculadas automaticamente a partir do <strong>controle de ponto</strong> de cada funcionário:
        <ul style="margin:6px 0 0;padding-left:18px;color:var(--ink-2)">
          <li>Sábado trabalhado → <strong>HE 50%</strong></li>
          <li>Domingo / feriado trabalhado → <strong>HE 100%</strong></li>
          <li>Horas que excedem a carga diária em dias úteis → <strong>HE 50%</strong></li>
        </ul>
      </div>

      <h4 class="mt-4">Lançamentos padrão (aplicados a todos)</h4>
      <div class="form-grid">
        <div class="field"><label>Dias trab.</label><input type="number" name="dias_trabalhados" value="30"></div>
        <div class="field"><label>Adic. Noturno (h)</label><input type="number" name="adicional_noturno_horas" value="0" step="0.5"></div>
        <div class="field"><label>Bônus (R$)</label><input type="number" name="bonus" value="0" step="0.01"></div>
        <div class="field"><label>Faltas (dias)</label><input type="number" name="faltas_dias" value="0"></div>
      </div>
    </form>`;
    showFormModal('Gerar holerites em lote', html, async () => {
      const f = document.getElementById('loteForm');
      if (!validateForm(f)) return;
      const data = formToObject(f);
      const payload = {
        competencia_mes: parseInt(data.competencia_mes),
        competencia_ano: parseInt(data.competencia_ano),
        data_pagamento: data.data_pagamento,
        department_id: data.department_id || null,
        lancamentos_padrao: {
          dias_trabalhados: parseInt(data.dias_trabalhados) || 30,
          adicional_noturno_horas: parseFloat(data.adicional_noturno_horas) || 0,
          bonus: parseFloat(data.bonus) || 0,
          faltas_dias: parseInt(data.faltas_dias) || 0,
        },
      };
      showLoading();
      try {
        const r = await api('/payslips/lote', { method: 'POST', body: payload });
        toast(`${r.criados} holerite(s) gerado(s) (${r.erros} erro(s))`, r.erros ? 'warning' : 'success');
        closeFormModal();
        carregar();
      } catch (err) { toast(err.message, 'error'); }
      finally { hideLoading(); }
    });
  }

  function showFormModal(title, html, onSave) {
    let m = document.getElementById('form-modal');
    if (!m) { m = document.createElement('div'); m.id = 'form-modal'; m.className = 'modal-overlay'; m.onclick = (e) => { if (e.target === m) closeFormModal(); }; document.body.appendChild(m); }
    m.innerHTML = `<div class="modal"><div class="modal-header"><h2>${title}</h2><button class="modal-close" onclick="closeFormModal()">×</button></div><div class="modal-body">${html}</div><div class="modal-footer"><button class="btn" onclick="closeFormModal()">Cancelar</button><button class="btn btn-primary" id="form-save">Salvar</button></div></div>`;
    m.classList.remove('hidden');
    document.getElementById('form-save').onclick = onSave;
  }
  function closeFormModal() { document.getElementById('form-modal')?.remove(); }

  carregar();
</script>
</body>
</html>
